name: Daily Blacklist Update

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch latest HedgeDoc threat list
        run: |
          curl -sL "https://md.archlinux.org/s/SxbqukK6IA/download" > aur-blacklist.txt

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add aur-blacklist.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily threat list update" && git push)
